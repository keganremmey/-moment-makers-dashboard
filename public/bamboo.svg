    <path d="M60 820 L60 90 Q60 70 72 70 Q84 70 84 90 L84 820 Z" fill="#1F7A53"/>
    <rect x="58" y="150" width="28" height="6" rx="3" fill="#2A1B12" opacity="0.35"/>
    <rect x="58" y="240" width="28" height="6" rx="3" fill="#2A1B12" opacity="0.35"/>
    <rect x="58" y="330" width="28" height="6" rx="3" fill="#2A1B12" opacity="0.35"/>
