<svg width="420" height="820" viewBox="0 0 420 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hand-drawn bamboo grove accent: three stalks of varying height and
       weight, each with node rings and a few blade-leaf clusters. Flat,
       stylized silhouettes (not photoreal) to match the rest of the
       system's flat card/belt language. Colored in the jade token at low
       opacity so it reads as atmosphere — used both as a small header
       accent and layered into the base of public/valley-floor.svg. -->

  <!-- back stalk, tallest, faintest -->
