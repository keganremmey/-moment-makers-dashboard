    <rect x="58" y="510" width="28" height="6" rx="3" fill="#2A1B12" opacity="0.35"/>
    <rect x="58" y="600" width="28" height="6" rx="3" fill="#2A1B12" opacity="0.35"/>
    <path d="M72 100 Q10 60 4 10 Q56 30 72 100Z" fill="#1F7A53"/>
    <path d="M84 130 Q150 100 165 55 Q105 70 84 130Z" fill="#1F7A53"/>
