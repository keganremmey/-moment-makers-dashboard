  <path
    d="M0 250 L160 190 L300 235 L450 165 L600 230 L760 155 L900 225 L1050 175 L1200 240 L1440 205 L1440 300 L0 300 Z"
    fill="#4f6b45"
    opacity="0.65"
  />

