<svg width="1440" height="230" viewBox="0 70 1440 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Valley floor: the signature strip at the bottom of every dashboard
       page. Three layered, hand-drawn mountain silhouettes echoing
       Fortissimo Summit's peak-with-brass-cap shape language (see
       FrameworkTerrainMap.tsx), fading from translucent/far to solid/near,
       with bamboo clusters growing up from the base — same flat,
       no-gradient, no-filter illustration language as bamboo.svg. -->

  <!-- farthest range, most translucent -->
